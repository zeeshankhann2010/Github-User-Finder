<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h2>GitHub Finder</h2>

            <div class="search">
                <input id="userInput" type="text" placeholder="Enter username">
                <button onclick="getUser()">Search</button>
            </div>

            <div class="profile">

                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="avatar">

                <h3>Username</h3>
                <p class="bio">Bio will appear here</p>

                <div class="stats">

                    <div>
                        <h4>0</h4>
                        <span>Repos</span>
                    </div>

                    <div>
                        <h4>0</h4>
                        <span>Followers</span>
                    </div>

                    <div>
                        <h4>0</h4>
                        <span>Following</span>
                    </div>

                </div>


            </div>

        </div>

    </div>

</body>

<script src="./app.js"></script>

</html>
